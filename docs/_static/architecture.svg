<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <style>
    .box { fill: #f7f9fc; stroke: #4a6fa5; stroke-width: 1.5; rx: 6; }
    .abstract { fill: #eef3fb; stroke-dasharray: 5 3; }
    .title { font-size: 15px; font-weight: bold; fill: #1f2d3d; }
    .label { fill: #334155; }
    .note { fill: #64748b; font-size: 11px; }
    .line { stroke: #64748b; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    .group { fill: none; stroke: #cbd5e1; stroke-width: 1.2; rx: 10; }
  </style>

  <text x="410" y="28" text-anchor="middle" class="title">TinyDB class relationships</text>

  <rect x="30" y="50" width="360" height="210" class="group"/>
